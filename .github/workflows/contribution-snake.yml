name: Update contribution snake

on:
  schedule:
    # 06:15 Asia/Shanghai; GitHub may delay scheduled runs.
    - cron: '15 22 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/contribution-snake.yml

permissions:
  contents: write

concurrency:
  group: contribution-snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out profile
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Generate light and dark animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            assets/contribution-snake.svg?color_snake=#1f2328
            assets/contribution-snake-dark.svg?palette=github-dark&color_snake=#C9AA58

      - name: Save updated animations
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/contribution-snake.svg assets/contribution-snake-dark.svg
          if git diff --cached --quiet; then
            echo 'Contribution animations are already up to date.'
            exit 0
          fi
          git commit -m 'chore: refresh contribution snake animations'
          git pull --rebase origin main
          git push origin HEAD:main
