<svg xmlns="http://www.w3.org/2000/svg" width="720" height="930" viewBox="0 0 720 930" fill="none" role="img" aria-labelledby="title desc">
<title id="title">Skymoni community invitation — your next idea belongs here.</title>
<desc id="desc">Join the Skymoni community. Talk AI, share your work and find new inspiration. A cloud friend welcomes you at a cream-colored shop in the sky. Free to join.</desc>

<defs>
  <linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fffdf7"/><stop offset="1" stop-color="#fbf6ec"/></linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf6fc"/><stop offset="1" stop-color="#dbeafa"/></linearGradient>
  <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#668fd0"/><stop offset="1" stop-color="#5279b7"/></linearGradient>
  <linearGradient id="glass" x2="0" y2="1"><stop stop-color="#eef7fc"/><stop offset="1" stop-color="#fffdf7"/></linearGradient>
  <pattern id="grain" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r=".6" fill="#b4a78c" opacity=".12"/><circle cx="13" cy="14" r=".5" fill="#b4a78c" opacity=".1"/></pattern>
  <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#7293af" flood-opacity=".12"/></filter>
  <g id="twinkle"><path d="M0-10Q2-2 10 0 2 2 0 10-2 2-10 0-2-2 0-10Z"/></g>
  <g id="cloud"><path d="M-65 26C-98 25-100-16-70-22-72-58-23-73-4-41 22-67 60-43 58-18 91-21 98 23 65 26Z" fill="#fffefb" stroke="#a6c6df" stroke-width="2"/><path d="M-65 25H65" stroke="#dceaf2" stroke-width="5" stroke-linecap="round"/></g>
  <g id="plane"><path d="m-32 4 65-23L7 27-1 8Z" fill="#fffefb" stroke="#7b9fc5" stroke-width="1.8" stroke-linejoin="round"/><path d="M-1 8 33-19 7 27 5 9Z" fill="#dcecf8"/><path d="M-1 8 33-19 5 9" stroke="#7b9fc5" stroke-width="1.5" stroke-linejoin="round"/></g>
  <g id="shop">
    <ellipse cx="205" cy="329" rx="161" ry="18" fill="#8baed0" opacity=".12"/>
    <!-- A tiny community storefront, inspired by the actual forum awning. -->
    <rect x="51" y="106" width="308" height="214" rx="16" fill="#fffdf7" stroke="#91b2cc" stroke-width="2" filter="url(#shadow)"/>
    <rect x="67" y="129" width="276" height="152" rx="8" fill="url(#glass)" stroke="#d8e5ed"/>
    <path d="M72 266H338" stroke="#d4e4ee" stroke-width="2"/>
    <path d="M255 131v134" stroke="#d4e4ee" stroke-width="2"/>
    <path d="M267 145h29m-29 8h44" stroke="#c6dceb" stroke-width="2" stroke-linecap="round"/>
    <rect x="130" y="27" width="152" height="49" rx="12" fill="#fffdf8" stroke="#95b4d0" stroke-width="1.8"/>
    <path d="M148 76v20m116-20v20" stroke="#95b4d0" stroke-width="2"/>
    <text x="206" y="59" text-anchor="middle" fill="#476b98" font-size="18" font-weight="600">Open for ideas</text>
    <path d="M44 97H366l8 40H36Z" fill="#d8eaf4" stroke="#8eafc9" stroke-width="2"/>
    <g stroke="#9cb7c9" stroke-width="1.5">
      <path d="M44 97h40v40a20 20 0 0 1-40 0Z" fill="#d9ecf8"/>
      <path d="M84 97h40v40a20 20 0 0 1-40 0Z" fill="#faedc9"/>
      <path d="M124 97h40v40a20 20 0 0 1-40 0Z" fill="#d9ecf8"/>
      <path d="M164 97h40v40a20 20 0 0 1-40 0Z" fill="#faedc9"/>
      <path d="M204 97h40v40a20 20 0 0 1-40 0Z" fill="#d9ecf8"/>
      <path d="M244 97h40v40a20 20 0 0 1-40 0Z" fill="#faedc9"/>
      <path d="M284 97h40v40a20 20 0 0 1-40 0Z" fill="#d9ecf8"/>
      <path d="M324 97h42l8 40a24 20 0 0 1-50 0Z" fill="#faedc9"/>
    </g>
    <!-- The cloud host reaches out from behind the counter. -->
    <g class="host">
      <g transform="translate(165 222) scale(.88)">
        <use href="#cloud"/>
        <path d="M-26-9v6m45-6v6" stroke="#4e6e93" stroke-width="4.5" stroke-linecap="round"/>
        <path d="M-8 6q8 10 16 0" stroke="#4e6e93" stroke-width="2.5" stroke-linecap="round"/>
        <ellipse cx="-39" cy="7" rx="10" ry="5" fill="#f4d5d7"/><ellipse cx="38" cy="7" rx="10" ry="5" fill="#f4d5d7"/>
        <path d="m33-48 5-11 7 9 12 1-7 10 2 12-12-4-10 6 1-13-8-8Z" fill="#f6d991" stroke="#d9b967" stroke-width="1.3"/>
      </g>
      <path d="M229 225q18-19 11-29" stroke="#a6c6df" stroke-width="10" stroke-linecap="round"/>
      <path d="m250 181 4-6m-1 19h7" stroke="#b1c6d8" stroke-width="2" stroke-linecap="round"/>
    </g>
    <rect x="40" y="267" width="331" height="21" rx="6" fill="#deebf4" stroke="#99b7cd" stroke-width="1.6"/>
    <path d="M63 289v31m285-31v31" stroke="#91b2cc" stroke-width="2"/>
    <text x="205" y="310" text-anchor="middle" fill="#7c95ac" font-size="11" letter-spacing="3">A LITTLE PLACE FOR BIG IDEAS</text>
    <!-- A work in progress sits in the window. -->
    <g transform="translate(272 188) rotate(8 30 34)">
      <rect width="62" height="67" rx="6" fill="#fffdf7" stroke="#a9bfd2" stroke-width="1.4"/>
      <rect x="8" y="9" width="46" height="29" rx="3" fill="#e1edf9"/>
      <path d="m15 31 11-12 10 9 6-5 8 8" stroke="#92b1d2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="43" cy="17" r="4" fill="#f8df9c"/>
      <path d="M10 48h28m-28 7h39" stroke="#b8cad8" stroke-width="2.5" stroke-linecap="round"/>
    </g>
    <!-- Small plants and little details make the place feel inhabited. -->
    <path d="M34 302q-18-16-13-27 16 1 16 26m0-4q6-22 18-20 0 15-18 25" fill="#bfd5ca" stroke="#87aa9d" stroke-width="1.5"/>
    <path d="M22 301h29l-4 24H26Z" fill="#efdfc6" stroke="#bda98c" stroke-width="1.4"/>
    <path d="M374 325h23" stroke="#b0c6d4" stroke-width="2" stroke-linecap="round"/>
    <path d="M385 304v20m-7-20h14l-3-21h-7Z" fill="#fff0c6" stroke="#ccb67d" stroke-width="1.5"/>
  </g>
</defs>
<style>
  text{font-family:"Segoe UI","Microsoft YaHei","PingFang SC",Arial,sans-serif}
  .cloud-drift{animation:cloud-drift 10s ease-in-out infinite alternate}
  .cloud-late{animation-delay:-5s}
  .host{animation:hello 5s ease-in-out infinite;transform-origin:170px 250px}
  .plane-flight{animation:plane-flight 8s ease-in-out infinite}
  .trail{stroke-dasharray:3 8;animation:trail 8s linear infinite}
  .shine{animation:shine 3.5s ease-in-out infinite alternate}
  @keyframes cloud-drift{to{transform:translateX(14px)}}
  @keyframes hello{0%,40%,100%{transform:translateY(0)}50%,65%{transform:translateY(-5px)}}
  @keyframes plane-flight{0%,100%{transform:translate(0,0) rotate(-3deg)}50%{transform:translate(15px,-9px) rotate(5deg)}}
  @keyframes trail{to{stroke-dashoffset:-88}}
  @keyframes shine{from{opacity:.35}to{opacity:1}}
  @media(prefers-reduced-motion:reduce){.cloud-drift,.host,.plane-flight,.trail,.shine{animation:none}}
</style>


<defs><clipPath id="frame"><rect x="1" y="1" width="718" height="928" rx="25"/></clipPath></defs>
<g clip-path="url(#frame)">
  <path fill="url(#paper)" d="M0 0h720v930H0z"/><path fill="url(#grain)" d="M0 0h720v930H0z"/>
  <path d="M0 592q182-64 361-17t359-20v375H0Z" fill="url(#sky)"/>
  <g transform="translate(65 65) scale(.25)"><use href="#cloud"/></g>
  <text x="92" y="76" fill="#304a6a" font-size="31" font-weight="700" letter-spacing="-1">skymoni</text>
  <text x="256" y="74" fill="#7b8da2" font-size="19">COMMUNITY / AN INVITATION</text>
  <path d="M48 109h624" stroke="#dee5e9"/>
  <text x="48" y="151" fill="#8c9eb1" font-size="13" letter-spacing="2.2">A NOTE FROM THE CLOUDS, JUST FOR YOU.</text>
<text x="48" y="241" fill="#304968" font-size="64" font-family="Georgia, Times New Roman, serif" font-weight="700" letter-spacing="-1.5">Your next idea,</text><text x="48" y="326" fill="#567fb8" font-size="70" font-family="Georgia, Times New Roman, serif" font-weight="700" letter-spacing="-1.5">belongs here.</text>
  <path d="M52 345q207 13 441-1" stroke="#eed8a5" stroke-width="6" stroke-linecap="round" opacity=".7"/>
  <text x="48" y="390" fill="#65758b" font-size="25">Talk AI. Share your work. Find new ideas.</text>
  <text x="48" y="432" fill="#65758b" font-size="25">Come as you are. Let's create together.</text>
  <rect x="48" y="467" width="272" height="68" rx="20" fill="url(#blue)"/>
  <text x="77" y="511" fill="#fff" font-size="27" font-weight="600">Join us</text>
  <path d="m274 511 14-14m-14 0h14v14" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="345" y="496" fill="#7389a0" font-size="16">Free to join. Bring your curiosity.</text>
  <text x="345" y="524" fill="#8b9fb2" font-size="16">skymoni.com/creators</text>
  <g transform="translate(138 555) scale(.94)"><use href="#shop"/></g>
  <circle cx="603" cy="657" r="33" fill="#f8ebc7" opacity=".75"/>
  <g transform="translate(79 660)"><g class="cloud-drift"><use href="#cloud" transform="scale(.6)" opacity=".7"/></g></g>
  <g transform="translate(634 806)"><g class="cloud-drift cloud-late"><use href="#cloud" transform="scale(.7)" opacity=".7"/></g></g>
  <path class="trail" d="M475 620c-32-36 13-70 49-39s-40 51-31 12 46-49 76-43" stroke="#9eb8cf" stroke-width="1.8"/>
  <g transform="translate(594 554)"><g class="plane-flight"><use href="#plane" transform="scale(.85)"/></g></g>
  <use href="#twinkle" class="shine" transform="translate(95 791) scale(.7)" fill="#d9b768"/>
  <text x="360" y="904" text-anchor="middle" fill="#8a9fb3" font-size="12" letter-spacing="3">YOUR IDEAS HAVE A PLACE HERE.</text>
</g>
<rect x=".75" y=".75" width="718.5" height="928.5" rx="24.25" stroke="#d9e2e9" stroke-width="1.5"/>

</svg>