<svg xmlns="http://www.w3.org/2000/svg" width="600" height="290" viewBox="0 0 600 290" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Skymoni Community — Your ideas belong here.</title>
  <desc id="desc">A little cloud shop welcomes you. Ask anything, share what you make, and join the community.</desc>
  <defs>
