    <g font-family="Georgia,'Times New Roman',serif" font-size="36" font-weight="700" letter-spacing="-.8">
      <text x="266" y="104" fill="#324d67">Your ideas</text>
      <text x="266" y="147" fill="#5c83b6">belong here.</text>
    </g>
    <text x="268" y="184" fill="#6d8194" font-size="21">Ask. Share. Create.</text>
