  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eaf4f9"/><stop offset="1" stop-color="#fffdf7"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6b93c8"/><stop offset="1" stop-color="#557db3"/></linearGradient>
  <pattern id="paper" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r=".6" fill="#c8bba3" opacity=".12"/></pattern>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#91aac0" flood-opacity=".13"/></filter>
