      <path d="M-8 6q8 10 16 0" stroke="#4e6e93" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="-39" cy="7" rx="10" ry="5" fill="#f4d5d7"/><ellipse cx="38" cy="7" rx="10" ry="5" fill="#f4d5d7"/>
    </g>
