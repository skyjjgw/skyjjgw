      <text x="28" y="199" fill="#304b6b" font-size="38" font-weight="600" letter-spacing="-.8">grow together.</text>
      <text x="28" y="242" fill="#687e94" font-size="22">Ask. Share. Create.</text>
      <rect x="28" y="312" width="544" height="50" rx="25" fill="url(#button)"/>
