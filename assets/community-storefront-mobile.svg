<svg xmlns="http://www.w3.org/2000/svg" width="600" height="384" viewBox="0 0 600 384" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Skymoni Community — Good ideas grow together.</title>
  <desc id="desc">A friendly community shop window. Ask questions, share what you make, and come inside.</desc>
  <defs>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9f4fa"/><stop offset="1" stop-color="#f8fbfc"/></linearGradient>
    <linearGradient id="button" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6b94cf"/><stop offset="1" stop-color="#557fb9"/></linearGradient>
    <g id="cloud">
      <path d="M-65 26C-98 25-100-16-70-22-72-58-23-73-4-41 22-67 60-43 58-18 91-21 98 23 65 26Z" fill="#fffefb" stroke="#a6c6df" stroke-width="2.5"/>
