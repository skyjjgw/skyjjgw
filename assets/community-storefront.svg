    <text x="52" y="167" fill="#304b6b" font-size="58" font-weight="600" letter-spacing="-1.5">Good ideas</text>
    <text x="52" y="229" fill="#304b6b" font-size="58" font-weight="600" letter-spacing="-1.5">grow together.</text>
    <text x="52" y="268" fill="#687e94" font-size="24">Ask questions. Share what you make.</text>
