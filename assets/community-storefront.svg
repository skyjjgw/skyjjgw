<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Skymoni Community — Your ideas belong here.</title>
  <desc id="desc">An invitation to a little cloud shop under a starry night sky. Ask anything, share what you make, and join the Skymoni community.</desc>
  <defs>
  <linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0c1626"/><stop offset="1" stop-color="#111f33"/></linearGradient>
  <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#16283f"/><stop offset="1" stop-color="#0e1b2e"/></linearGradient>
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1d334d"/><stop offset="1" stop-color="#101b2d"/></linearGradient>
  <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#337fc7"/><stop offset="1" stop-color="#566cd1"/></linearGradient>
  <pattern id="paper" width="64" height="64" patternUnits="userSpaceOnUse"><circle cx="3" cy="5" r=".6" fill="#92aed2" opacity=".18"/></pattern>
  <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="5" stdDeviation="5" flood-color="#050b16" flood-opacity=".35"/></filter>
  <g id="cloud">
      <path d="M-65 26C-98 25-100-16-70-22-72-58-23-73-4-41 22-67 60-43 58-18 91-21 98 23 65 26Z" fill="#dceafa" stroke="#85a8c8" stroke-width="2.5"/>
      <path d="M-26-9v6m45-6v6" stroke="#355575" stroke-width="4.5" stroke-linecap="round"/>
      <path d="M-8 6q8 10 16 0" stroke="#355575" stroke-width="2.5" stroke-linecap="round"/>
      <ellipse cx="-39" cy="7" rx="10" ry="5" fill="#cfaebf"/><ellipse cx="38" cy="7" rx="10" ry="5" fill="#cfaebf"/>
    </g>
  <g id="star"><path d="m0-14 4.5 9.5 10.5 1.7-7.5 7.5 1.7 10.5L0 10l-9.2 5.2 1.7-10.5-7.5-7.5 10.5-1.7Z" fill="#c6c5af" stroke="#8e9aa3" stroke-width="1.5" stroke-linejoin="round"/></g>
  <g id="shop-scene">
    <rect x="36" y="28" width="470" height="384" rx="220" fill="url(#sky)"/>
    <circle cx="418" cy="91" r="36" fill="#b9c7d9" opacity=".8"/>
