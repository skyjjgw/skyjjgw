<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="348" viewBox="0 0 1200 348" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Skymoni Community — Good ideas grow together.</title>
  <desc id="desc">A community shop window with a striped awning, a friendly cloud behind the counter, and an invitation to come inside. Ask questions and share what you make.</desc>
