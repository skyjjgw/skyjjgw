    <ellipse cx="270" cy="385" rx="185" ry="13" fill="#050a13" opacity=".22"/>
    <path d="M200 120v23m138-23v23" stroke="#6286ac" stroke-width="3"/>
    <rect x="174" y="70" width="192" height="54" rx="13" fill="#101b2d" stroke="#6286ac" stroke-width="2" filter="url(#soft-shadow)"/>
    <text x="270" y="107" text-anchor="middle" fill="#e9f1fc" font-family="Segoe UI,Arial,sans-serif" font-size="29" font-weight="700" letter-spacing="-1">skymoni</text>
    <rect x="100" y="157" width="340" height="208" rx="12" fill="#101b2d" stroke="#6286ac" stroke-width="2" filter="url(#soft-shadow)"/>
    <rect x="116" y="183" width="308" height="132" rx="7" fill="url(#glass)" stroke="#344c69" stroke-width="1.5"/>
