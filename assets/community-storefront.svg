    <path d="M108 366v10m324-10v10" stroke="#6286ac" stroke-width="3" stroke-linecap="round"/>
    <path d="M94 139h44v36a22 16 0 0 1-44 0Z" fill="#283f5c" stroke="#6286ac" stroke-width="1.5"/>
<path d="M138 139h44v36a22 16 0 0 1-44 0Z" fill="#384657" stroke="#6286ac" stroke-width="1.5"/>
<path d="M182 139h44v36a22 16 0 0 1-44 0Z" fill="#283f5c" stroke="#6286ac" stroke-width="1.5"/>
<path d="M226 139h44v36a22 16 0 0 1-44 0Z" fill="#384657" stroke="#6286ac" stroke-width="1.5"/>
<path d="M270 139h44v36a22 16 0 0 1-44 0Z" fill="#283f5c" stroke="#6286ac" stroke-width="1.5"/>
<path d="M314 139h44v36a22 16 0 0 1-44 0Z" fill="#384657" stroke="#6286ac" stroke-width="1.5"/>
<path d="M358 139h44v36a22 16 0 0 1-44 0Z" fill="#283f5c" stroke="#6286ac" stroke-width="1.5"/>
<path d="M402 139h44v36a22 16 0 0 1-44 0Z" fill="#384657" stroke="#6286ac" stroke-width="1.5"/>
    <path d="M94 138h352" stroke="#6286ac" stroke-width="3" stroke-linecap="round"/>
    <g transform="translate(66 350)">
      <path d="M5 5C-15-4-18-22-13-29 4-25 7-11 5 5M7 2c1-18 14-26 24-25 1 14-8 25-24 25" fill="#5b7f79" stroke="#3f6468" stroke-width="1.5"/>
      <path d="M-7 3h29l-4 29H-3Z" fill="#6f6e6e" stroke="#85929c" stroke-width="1.5"/>
    </g>
    <use href="#star" transform="translate(466 220) scale(.65)"/>
    <circle cx="76" cy="250" r="3" fill="#6487ae"/>
    <path d="M453 50v10m-5-5h10" stroke="#759bc4" stroke-width="2" stroke-linecap="round"/>
  </g>
</defs>
  <rect x="1" y="1" width="1198" height="198" rx="22" fill="url(#night)" stroke="#2b405c" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="196" rx="21" fill="url(#paper)"/>
  <use href="#shop-scene" transform="translate(25 3) scale(.44)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif">
    <text x="300" y="42" fill="#91a9c7" font-size="16" font-weight="600" letter-spacing="2.6">SKYMONI COMMUNITY</text>
    <text x="297" y="99" font-family="Georgia,'Times New Roman',serif" font-size="50" font-weight="700" letter-spacing="-1.6" fill="#e9f1fc">Your ideas <tspan fill="#8fb8ef">belong here.</tspan></text>
    <text x="300" y="149" fill="#a8b8ce" font-size="23">Ask anything. Share what you make.</text>
    <rect x="866" y="117" width="286" height="48" rx="14" fill="url(#blue)"/>
    <text x="887" y="149" fill="#fff" font-size="22" font-weight="600">Join the community</text>
    <path d="M1110 149l14-14m-13 0h13v13" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
