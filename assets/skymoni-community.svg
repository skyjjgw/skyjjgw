<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Skymoni 创作者社区 · 让灵感相遇，让作品被看见。</title>
  <desc id="desc">欢迎加入我们的社区。分享作品，交流 AI 与技术，遇见一起创造的人。点击访问 skymoni.com/creators。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="440" gradientUnits="userSpaceOnUse"><stop stop-color="#0b1623"/><stop offset=".54" stop-color="#0b1c29"/><stop offset="1" stop-color="#102b32"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1200" y2="440" gradientUnits="userSpaceOnUse"><stop stop-color="#45576a"/><stop offset=".5" stop-color="#253f4a"/><stop offset="1" stop-color="#588778"/></linearGradient>
    <linearGradient id="mint" x1="62" y1="200" x2="590" y2="275" gradientUnits="userSpaceOnUse"><stop stop-color="#dcffec"/><stop offset=".65" stop-color="#a4efcb"/><stop offset="1" stop-color="#75cfbf"/></linearGradient>
    <linearGradient id="button" x2="1" y2="1"><stop stop-color="#d0f9dc"/><stop offset="1" stop-color="#91e1bd"/></linearGradient>
    <radialGradient id="aurora"><stop stop-color="#62e0b8" stop-opacity=".17"/><stop offset="1" stop-color="#62e0b8" stop-opacity="0"/></radialGradient>
    <radialGradient id="blue"><stop stop-color="#6886db" stop-opacity=".13"/><stop offset="1" stop-color="#6886db" stop-opacity="0"/></radialGradient>
    <radialGradient id="core"><stop stop-color="#b3f5d5" stop-opacity=".14"/><stop offset=".6" stop-color="#54c5ae" stop-opacity=".04"/><stop offset="1" stop-color="#54c5ae" stop-opacity="0"/></radialGradient>
    <linearGradient id="star" x1="-55" y1="-65" x2="55" y2="65" gradientUnits="userSpaceOnUse"><stop stop-color="#f4ffe7"/><stop offset=".5" stop-color="#b4f4d2"/><stop offset="1" stop-color="#65b8b0"/></linearGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" stroke="#a2cfcc" stroke-opacity=".035"/></pattern>
    <clipPath id="clip"><rect x="1" y="1" width="1198" height="438" rx="23"/></clipPath>
  </defs>
  <style>
    text{font-family:Inter,"Segoe UI","Microsoft YaHei","PingFang SC",Arial,sans-serif}
    .orbit{transform-origin:940px 214px;animation:orbit 60s linear infinite}
    .orbit-back{transform-origin:940px 214px;animation:orbit 80s linear infinite reverse}
    .spark{animation:twinkle 5s ease-in-out infinite alternate}
    .spark-late{animation-delay:-2.5s}
    .beacon{animation:breathe 4s ease-in-out infinite}
    .lift{animation:float 7s ease-in-out infinite}
    @keyframes orbit{to{transform:rotate(360deg)}}
    @keyframes twinkle{from{opacity:.28}to{opacity:.9}}
    @keyframes breathe{0%,100%{opacity:.4}50%{opacity:.95}}
    @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
    @media(prefers-reduced-motion:reduce){.orbit,.orbit-back,.spark,.beacon,.lift{animation:none}}
  </style>
  <g clip-path="url(#clip)">
    <path fill="url(#bg)" d="M0 0h1200v440H0z"/>
    <path fill="url(#grid)" d="M0 0h1200v440H0z"/>
    <ellipse cx="1040" cy="223" rx="400" ry="350" fill="url(#aurora)"/>
    <ellipse cx="566" cy="-52" rx="420" ry="285" fill="url(#blue)"/>
    <path d="M680 440C762 282 730 72 928-48M738 460C827 294 772 86 1001-50" stroke="#a8e8d2" stroke-opacity=".06"/>
    <path d="M64 78h28m-14-14v28" stroke="#bbf4d6" stroke-width="2"/>
    <path d="m78 65 3 10 10 3-10 3-3 10-3-10-10-3 10-3z" fill="#bbf4d6"/>
    <text x="105" y="86" fill="#effaf5" font-size="29" font-weight="650" letter-spacing="-.9">skymoni</text>
    <path d="M245 66v25" stroke="#526774"/>
    <text x="265" y="83" fill="#9bb6bd" font-size="12" font-weight="550" letter-spacing="2.5">CREATORS COMMUNITY</text>

    <text x="64" y="160" fill="#8da7b4" font-size="11" font-weight="600" letter-spacing="3.2">GOOD IDEAS DESERVE GOOD COMPANY.</text>
    <text x="61" y="220" fill="#f3f7f8" font-size="48" font-weight="700" letter-spacing="1">让灵感相遇，</text>
    <text x="61" y="282" fill="url(#mint)" font-size="48" font-weight="700" letter-spacing="1">让作品被看见。</text>
    <text x="64" y="321" fill="#adc0c8" font-size="17" letter-spacing=".4">分享作品 · 交流 AI 与技术 · 遇见一起创造的人</text>

    <rect x="64" y="352" width="239" height="51" rx="25.5" fill="url(#button)"/>
    <text x="88" y="384" fill="#153a32" font-size="17" font-weight="700">加入我们的社区</text>
    <path d="m267 384 12-12m-12 0h12v12" stroke="#153a32" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="324" y="383" fill="#a0b9bf" font-size="13" letter-spacing=".5">skymoni.com/creators</text>

    <circle cx="940" cy="214" r="190" fill="url(#core)"/>
    <circle cx="940" cy="214" r="157" stroke="#a3e8ce" stroke-opacity=".12"/>
    <circle cx="940" cy="214" r="119" stroke="#a3e8ce" stroke-opacity=".1" stroke-dasharray="2 9"/>
    <circle cx="940" cy="214" r="81" stroke="#c7f4dc" stroke-opacity=".15"/>
    <ellipse cx="940" cy="214" rx="182" ry="69" transform="rotate(-33 940 214)" stroke="#b3ecd3" stroke-opacity=".25"/>
    <ellipse cx="940" cy="214" rx="182" ry="69" transform="rotate(42 940 214)" stroke="#a2badd" stroke-opacity=".15"/>
    <g class="orbit">
      <circle cx="940" cy="57" r="4" fill="#d2ffe9"/>
      <circle cx="940" cy="57" r="11" stroke="#b3f4d3" stroke-opacity=".2"/>
      <path d="M1097 214a157 157 0 0 1-46 111" stroke="#bbf4d6" stroke-width="1.5" stroke-linecap="round"/>
      <circle cx="829" cy="325" r="3" fill="#b4c8f6"/>
    </g>
    <g class="orbit-back"><circle cx="1059" cy="214" r="3" fill="#a6d9ec"/><circle cx="821" cy="214" r="2" fill="#c7f5dc"/></g>
    <g class="lift">
      <g transform="translate(940 210)">
        <path d="M0-62C8-20 20-8 62 0 20 8 8 20 0 62-8 20-20 8-62 0-20-8-8-20 0-62Z" fill="url(#star)"/>
        <path d="M0-38v76m-38-38h76" stroke="#f3fff5" stroke-opacity=".55"/>
        <circle r="5" fill="#f6fff1"/>
      </g>
      <path d="m996 142 3 10 10 3-10 3-3 10-3-10-10-3 10-3z" fill="#d5f8e3"/>
    </g>

    <g transform="translate(761 104)">
      <rect width="100" height="39" rx="19.5" fill="#112a35" stroke="#34545e"/>
      <circle cx="20" cy="19.5" r="3" fill="#baf2d2"/>
      <text x="34" y="25" fill="#d9ede7" font-size="12" font-weight="550" letter-spacing="1.5">CREATE</text>
    </g>
    <g transform="translate(1051 271)">
      <rect width="95" height="39" rx="19.5" fill="#142e37" stroke="#385965"/>
      <circle cx="20" cy="19.5" r="3" fill="#b0c8fa"/>
      <text x="34" y="25" fill="#d9e6f4" font-size="12" font-weight="550" letter-spacing="1.5">SHARE</text>
    </g>
    <text x="940" y="337" text-anchor="middle" fill="#a0bcbf" font-size="10" letter-spacing="4">CONNECT · CREATE · INSPIRE</text>
    <circle class="beacon" cx="844" cy="397" r="3" fill="#a4eac5"/>
    <text x="858" y="401" fill="#a3bfbf" font-size="11" letter-spacing="1.8">YOUR NEXT CHAPTER STARTS HERE</text>

    <g fill="#d5f7e4">
      <circle class="spark" cx="693" cy="89" r="1.5"/><circle class="spark spark-late" cx="1114" cy="86" r="2"/>
      <circle class="spark" cx="1153" cy="364" r="1.5"/><circle class="spark spark-late" cx="714" cy="337" r="2"/>
      <circle class="spark" cx="1039" cy="40" r="1"/><circle class="spark spark-late" cx="694" cy="199" r="1"/>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="439" rx="23.5" stroke="url(#edge)"/>
</svg>
